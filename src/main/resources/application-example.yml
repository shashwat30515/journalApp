
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}

    redis:
      url: ${REDIS_URL}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${"client id"}
            client-secret: ${"clientsecret"}
  mail:
    host: smtp.gmail.com
    port: 587

    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  server:
  port: ${PORT:8080}
#  servlet:
#    context-path: /journalweather :
  api:
    key : XXXXXXXXXXXXXXXXX

